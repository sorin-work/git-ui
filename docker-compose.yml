name: git-ui

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Adds a few sample repositories when the folder is empty.
      SEED_DEMO: ${SEED_DEMO:-true}
      # Set both to require a login (HTTP basic auth) for everything.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      # Requests come through the web container's nginx: believe one hop of
      # X-Forwarded-For, so login throttling sees each client's address.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      # The folder with your repositories (REPOS_PATH=/home/me/code). git-ui
      # only reads from it, apart from creating the demo repositories when it
      # is empty. Without REPOS_PATH a named volume holds the demo data.
      - ${REPOS_PATH:-repos}:/repos

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8090}:80'

volumes:
  repos:
