server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Archives and large diffs can take a while on big repositories.
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # nginx's own error pages (a 502 while the server restarts) get the same
  # headers as the app.
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Client-side routing: every other path gets the app shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
